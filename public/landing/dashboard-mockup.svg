<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#dashGrad)"/>

  <!-- Animated particles -->
  <circle cx="100" cy="100" r="3" fill="#2dd4bf" opacity="0.6">
    <animate attributeName="cy" values="100;200;100" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="600" r="2" fill="#22d3ee" opacity="0.5">
    <animate attributeName="cy" values="600;500;600" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="700" r="2.5" fill="#2dd4bf" opacity="0.4">
    <animate attributeName="cx" values="200;250;200" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Main dashboard card -->
  <rect x="150" y="150" width="900" height="500" rx="24" fill="rgba(24, 24, 27, 0.7)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="2"/>

  <!-- XP Bar at top -->
  <rect x="200" y="200" width="800" height="60" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(45, 212, 191, 0.2)" stroke-width="1"/>
  <rect x="205" y="205" width="600" height="50" rx="10" fill="url(#cardGrad)"/>
  <text x="220" y="237" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2dd4bf">Level 12</text>
  <text x="920" y="237" font-family="Arial, sans-serif" font-size="16" fill="#a1a1aa">1250 XP</text>

  <!-- Stats cards row -->
  <!-- Card 1: Study Time -->
  <rect x="200" y="300" width="240" height="140" rx="16" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="2"/>
  <text x="220" y="340" font-family="Arial, sans-serif" font-size="14" fill="#a1a1aa">Study Time</text>
  <text x="220" y="380" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2dd4bf">48h</text>
  <text x="220" y="410" font-family="Arial, sans-serif" font-size="12" fill="#71717a">This week</text>

  <!-- Card 2: Streak -->
  <rect x="480" y="300" width="240" height="140" rx="16" fill="rgba(251, 146, 60, 0.1)" stroke="rgba(251, 146, 60, 0.3)" stroke-width="2"/>
  <text x="500" y="340" font-family="Arial, sans-serif" font-size="14" fill="#a1a1aa">Streak</text>
  <text x="500" y="380" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#fb923c">15🔥</text>
  <text x="500" y="410" font-family="Arial, sans-serif" font-size="12" fill="#71717a">Days active</text>

  <!-- Card 3: Tests Completed -->
  <rect x="760" y="300" width="240" height="140" rx="16" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="2"/>
  <text x="780" y="340" font-family="Arial, sans-serif" font-size="14" fill="#a1a1aa">Tests Done</text>
  <text x="780" y="380" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#a855f7">24</text>
  <text x="780" y="410" font-family="Arial, sans-serif" font-size="12" fill="#71717a">Completed</text>

  <!-- Achievement badges -->
  <circle cx="250" cy="550" r="35" fill="rgba(234, 179, 8, 0.2)" stroke="#eab308" stroke-width="3"/>
  <text x="250" y="560" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">🏆</text>

  <circle cx="350" cy="550" r="35" fill="rgba(34, 197, 94, 0.2)" stroke="#22c55e" stroke-width="3"/>
  <text x="350" y="560" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">⭐</text>

  <circle cx="450" cy="550" r="35" fill="rgba(236, 72, 153, 0.2)" stroke="#ec4899" stroke-width="3"/>
  <text x="450" y="560" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">💎</text>

  <!-- Decorative elements -->
  <path d="M 900 500 Q 920 520 900 540" stroke="#2dd4bf" stroke-width="2" fill="none" opacity="0.3">
    <animate attributeName="d" values="M 900 500 Q 920 520 900 540;M 900 500 Q 880 520 900 540;M 900 500 Q 920 520 900 540" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
