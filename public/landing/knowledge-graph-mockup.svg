  <text x="960" y="393" font-family="Arial, sans-serif" font-size="8" fill="#22d3ee" text-anchor="middle">ready</text>

  <!-- Mughal — ready -->
  <circle cx="490" cy="510" r="26" fill="rgba(168, 85, 247, 0.08)" stroke="#a855f7" stroke-width="2"/>
  <text x="490" y="506" font-family="Arial, sans-serif" font-size="8" fill="#a855f7" text-anchor="middle" font-weight="bold">Mughal</text>
  <text x="490" y="518" font-family="Arial, sans-serif" font-size="8" fill="#a855f7" text-anchor="middle">ready</text>

