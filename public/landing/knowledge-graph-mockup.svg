  <circle cx="360" cy="340" r="32" fill="rgba(45, 212, 191, 0.65)" stroke="#2DD4BF" stroke-width="2"/>
  <text x="360" y="334" font-family="Arial, sans-serif" font-size="8" fill="#0a1628" text-anchor="middle" font-weight="bold">Fundamental</text>
  <text x="360" y="345" font-family="Arial, sans-serif" font-size="8" fill="#0a1628" text-anchor="middle" font-weight="bold">Rights</text>
  <text x="360" y="357" font-family="Arial, sans-serif" font-size="8" fill="#0a1628" text-anchor="middle">in progress</text>

