  <circle cx="545" cy="235" r="34" fill="rgba(251, 191, 36, 0)" stroke="rgba(251, 191, 36, 0.6)" stroke-width="10" opacity="0.3">
    <animate attributeName="r" values="34;42;34" dur="1.8s" repeatCount="indefinite"/>
