<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080d1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1424;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="rgba(255,255,255,0.2)"/>
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="rgba(45, 212, 191, 0.6)"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#kgBg)"/>

  <!-- Ambient glows -->
  <circle cx="400" cy="350" r="300" fill="rgba(45, 212, 191, 0.04)"/>
  <circle cx="800" cy="400" r="250" fill="rgba(168, 85, 247, 0.04)"/>

  <!-- Outer card frame -->
  <rect x="60" y="60" width="1080" height="680" rx="24" fill="rgba(15, 20, 35, 0.9)" stroke="rgba(45, 212, 191, 0.15)" stroke-width="1.5"/>

  <!-- Header bar -->
  <rect x="60" y="60" width="1080" height="60" rx="24" fill="rgba(45, 212, 191, 0.07)"/>
  <rect x="60" y="96" width="1080" height="24" fill="rgba(45, 212, 191, 0.07)"/>

  <!-- Network icon in header -->
  <circle cx="105" cy="90" r="5" fill="rgba(45, 212, 191, 0.6)" stroke="#2DD4BF" stroke-width="1"/>
  <circle cx="122" cy="82" r="4" fill="rgba(168, 85, 247, 0.6)" stroke="#a855f7" stroke-width="1"/>
  <circle cx="122" cy="98" r="4" fill="rgba(249, 115, 22, 0.6)" stroke="#fb923c" stroke-width="1"/>
  <line x1="110" y1="88" x2="118" y2="84" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="110" y1="92" x2="118" y2="96" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="142" y="96" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">Knowledge Graph</text>

  <!-- Legend chips top right -->
  <rect x="750" y="72" width="70" height="18" rx="9" fill="rgba(45, 212, 191, 0.15)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1"/>
  <text x="785" y="84" font-family="Arial, sans-serif" font-size="8" fill="#2DD4BF" text-anchor="middle">Polity</text>
  <rect x="830" y="72" width="70" height="18" rx="9" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
  <text x="865" y="84" font-family="Arial, sans-serif" font-size="8" fill="#a855f7" text-anchor="middle">History</text>
  <rect x="910" y="72" width="70" height="18" rx="9" fill="rgba(249, 115, 22, 0.15)" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1"/>
  <text x="945" y="84" font-family="Arial, sans-serif" font-size="8" fill="#fb923c" text-anchor="middle">Geography</text>
  <rect x="990" y="72" width="70" height="18" rx="9" fill="rgba(34, 211, 238, 0.15)" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1"/>
  <text x="1025" y="84" font-family="Arial, sans-serif" font-size="8" fill="#22d3ee" text-anchor="middle">Economy</text>

  <!-- ═══ GRAPH EDGES (curved paths with arrows) ═══ -->

  <!-- Preamble → Fundamental Rights -->
  <path d="M 280 240 Q 310 290 340 320" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1.5" fill="none" marker-end="url(#arrowTeal)"/>
  <!-- Preamble → Parliamentary System -->
  <path d="M 300 230 Q 420 200 520 220" stroke="rgba(45, 212, 191, 0.25)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Fundamental Rights → DPSP -->
  <path d="M 370 360 Q 400 410 380 470" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Maurya → Gupta (History) -->
  <path d="M 200 540 Q 250 510 300 510" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Gupta → Mughal -->
  <path d="M 370 510 Q 420 490 460 500" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Physical Geography → Monsoon -->
  <path d="M 700 330 Q 750 380 780 420" stroke="rgba(249, 115, 22, 0.35)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Physical Geography → Rivers -->
  <path d="M 680 340 Q 660 420 640 460" stroke="rgba(249, 115, 22, 0.25)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- GDP Basics → Inflation -->
  <path d="M 900 250 Q 960 300 950 360" stroke="rgba(34, 211, 238, 0.35)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
