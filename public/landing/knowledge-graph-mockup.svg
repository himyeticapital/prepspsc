  <circle cx="680" cy="305" r="30" fill="rgba(249, 115, 22, 0)" stroke="rgba(249, 115, 22, 0.4)" stroke-width="8" opacity="0.4">
    <animate attributeName="r" values="30;38;30" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="305" r="30" fill="rgba(249, 115, 22, 0.65)" stroke="#fb923c" stroke-width="2"/>
  <text x="680" y="300" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">Physical</text>
  <text x="680" y="311" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">Geography</text>

