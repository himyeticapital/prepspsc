  <text x="375" y="496" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="middle">DPSP</text>
  <text x="375" y="508" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="middle">🔒</text>

  <!-- Constitutional Amendments — locked -->
  <circle cx="695" cy="375" r="28" fill="rgba(20, 25, 40, 0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" opacity="0.7"/>
  <text x="695" y="370" font-family="Arial, sans-serif" font-size="7.5" fill="rgba(255,255,255,0.3)" text-anchor="middle">Constitutional</text>
  <text x="695" y="381" font-family="Arial, sans-serif" font-size="7.5" fill="rgba(255,255,255,0.3)" text-anchor="middle">Amendments</text>
  <text x="695" y="393" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="middle">🔒</text>

  <!-- Rivers — locked -->
  <circle cx="635" cy="490" r="24" fill="rgba(20, 25, 40, 0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" opacity="0.7"/>
  <text x="635" y="486" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="middle">Rivers</text>
  <text x="635" y="498" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="middle">🔒</text>

  <!-- Monetary Policy — locked -->
  <circle cx="868" cy="420" r="26" fill="rgba(20, 25, 40, 0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" opacity="0.7"/>
  <text x="868" y="415" font-family="Arial, sans-serif" font-size="7.5" fill="rgba(255,255,255,0.3)" text-anchor="middle">Monetary</text>
  <text x="868" y="426" font-family="Arial, sans-serif" font-size="7.5" fill="rgba(255,255,255,0.3)" text-anchor="middle">Policy</text>
  <text x="868" y="438" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="middle">🔒</text>

  <!-- Monsoon — locked -->
  <circle cx="800" cy="445" r="26" fill="rgba(20, 25, 40, 0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" opacity="0.7"/>
  <text x="800" y="440" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="middle">Monsoon</text>
  <text x="800" y="452" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="middle">🔒</text>

  <!-- "Study Next" bottom panel -->
  <rect x="80" y="640" width="1040" height="80" rx="0" fill="rgba(10, 15, 28, 0.95)" stroke="rgba(45, 212, 191, 0.15)" stroke-width="0"/>
  <rect x="60" y="698" width="1080" height="42" rx="16" fill="rgba(10, 15, 28, 0.95)" stroke="rgba(45, 212, 191, 0.15)" stroke-width="1"/>
  <rect x="60" y="658" width="1080" height="82" rx="0" fill="rgba(10, 15, 28, 0.95)"/>
  <rect x="60" y="656" width="1080" height="84" rx="16" fill="rgba(10, 15, 28, 0.9)" stroke="rgba(45, 212, 191, 0.2)" stroke-width="1"/>

  <text x="90" y="677" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Study Next</text>

  <!-- Recommendation card 1 (gold — top pick) -->
  <rect x="90" y="683" width="290" height="46" rx="10" fill="rgba(251, 191, 36, 0.1)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5"/>
  <circle cx="113" cy="706" r="8" fill="rgba(251, 191, 36, 0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="113" y="710" font-family="Arial, sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle">★</text>
  <text x="128" y="702" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fbbf24">Parliamentary System</text>
  <text x="128" y="716" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">Unlocks 3 topics · High importance</text>
  <rect x="310" y="692" width="58" height="14" rx="7" fill="rgba(45, 212, 191, 0.15)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1"/>
  <text x="339" y="703" font-family="Arial, sans-serif" font-size="7" fill="#2DD4BF" text-anchor="middle">Polity</text>

  <!-- Recommendation card 2 -->
  <rect x="395" y="683" width="250" height="46" rx="10" fill="rgba(34, 211, 238, 0.06)" stroke="rgba(34, 211, 238, 0.2)" stroke-width="1"/>
  <text x="418" y="702" font-family="Arial, sans-serif" font-size="10" fill="#22d3ee">Inflation</text>
  <text x="418" y="716" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">18 PYQ questions</text>
  <rect x="600" y="692" width="58" height="14" rx="7" fill="rgba(34, 211, 238, 0.1)" stroke="rgba(34, 211, 238, 0.25)" stroke-width="1"/>
  <text x="629" y="703" font-family="Arial, sans-serif" font-size="7" fill="#22d3ee" text-anchor="middle">Economy</text>

  <!-- Recommendation card 3 -->
  <rect x="660" y="683" width="250" height="46" rx="10" fill="rgba(168, 85, 247, 0.06)" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1"/>
  <text x="683" y="702" font-family="Arial, sans-serif" font-size="10" fill="#a855f7">Mughal Empire</text>
  <text x="683" y="716" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">Unlocks 2 topics</text>
  <rect x="871" y="692" width="58" height="14" rx="7" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1"/>
  <text x="900" y="703" font-family="Arial, sans-serif" font-size="7" fill="#a855f7" text-anchor="middle">History</text>

  <!-- Floating dots -->
  <circle cx="1050" cy="580" r="2" fill="#2DD4BF" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/>
