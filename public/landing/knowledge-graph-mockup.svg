  <path d="M 880 265 Q 880 330 870 400" stroke="rgba(34, 211, 238, 0.25)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Parliamentary → Constitutional Amendments -->
  <path d="M 560 250 Q 620 300 660 340" stroke="rgba(45, 212, 191, 0.2)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ═══ GRAPH NODES ═══ -->

  <!-- MASTERED nodes (filled, teal) -->
  <!-- Preamble — mastered -->
  <circle cx="270" cy="225" r="30" fill="rgba(45, 212, 191, 0.85)" stroke="#2DD4BF" stroke-width="2" filter="url(#glow)"/>
  <text x="270" y="221" font-family="Arial, sans-serif" font-size="9" fill="#0a1628" text-anchor="middle" font-weight="bold">Preamble</text>
  <text x="270" y="233" font-family="Arial, sans-serif" font-size="13" fill="#0a1628" text-anchor="middle">✓</text>

  <!-- Maurya Era — mastered -->
  <circle cx="165" cy="530" r="26" fill="rgba(168, 85, 247, 0.85)" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
  <text x="165" y="526" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">Maurya</text>
