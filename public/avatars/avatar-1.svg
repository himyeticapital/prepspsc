<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cool Alex - Headphones, messy hair, streetwear vibes -->
  <defs>
    <linearGradient id="hp1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#3b82f6"/>

  <!-- Face -->
  <circle cx="50" cy="48" r="20" fill="#d4a574"/>

  <!-- Ears -->
  <ellipse cx="30" cy="48" rx="3" ry="5" fill="#c49a6c"/>
  <ellipse cx="70" cy="48" rx="3" ry="5" fill="#c49a6c"/>

  <!-- Messy cool hair -->
  <path d="M30 42 Q32 20 50 18 Q68 20 70 42 Q66 30 50 28 Q34 30 30 42" fill="#1f2937"/>
  <!-- Messy spikes -->
  <path d="M35 28 L32 18 L40 26" fill="#1f2937"/>
  <path d="M45 24 L44 14 L50 22" fill="#1f2937"/>
  <path d="M55 24 L56 14 L50 22" fill="#1f2937"/>
  <path d="M65 28 L68 18 L60 26" fill="#1f2937"/>
  <!-- Side hair -->
  <path d="M30 38 Q28 45 30 52" fill="#1f2937"/>
  <path d="M70 38 Q72 45 70 52" fill="#1f2937"/>

  <!-- Headphones band -->
  <path d="M26 42 Q26 22 50 20 Q74 22 74 42" stroke="#374151" stroke-width="5" fill="none"/>
  <path d="M26 42 Q26 22 50 20 Q74 22 74 42" stroke="#4b5563" stroke-width="3" fill="none"/>

  <!-- Headphone cups -->
  <ellipse cx="26" cy="48" rx="8" ry="10" fill="url(#hp1)"/>
  <ellipse cx="74" cy="48" rx="8" ry="10" fill="url(#hp1)"/>
  <ellipse cx="26" cy="48" rx="5" ry="7" fill="#7c3aed"/>
  <ellipse cx="74" cy="48" rx="5" ry="7" fill="#7c3aed"/>
  <!-- Headphone details -->
  <ellipse cx="26" cy="48" rx="3" ry="4" fill="#1f2937"/>
  <ellipse cx="74" cy="48" rx="3" ry="4" fill="#1f2937"/>

  <!-- Eyebrows -->
  <path d="M38 40 Q42 38 46 40" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M54 40 Q58 38 62 40" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Eyes - relaxed cool -->
  <ellipse cx="42" cy="46" rx="3.5" ry="4" fill="#1f2937"/>
  <ellipse cx="58" cy="46" rx="3.5" ry="4" fill="#1f2937"/>
  <circle cx="43" cy="45" r="1.3" fill="white"/>
  <circle cx="59" cy="45" r="1.3" fill="white"/>

  <!-- Nose -->
  <path d="M50 48 L50 52" stroke="#c49a6c" stroke-width="2" stroke-linecap="round"/>

  <!-- Chill smile -->
  <path d="M44 56 Q50 60 56 56" stroke="#8b6f5c" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Hoodie -->
  <path d="M24 80 Q24 66 40 64 L50 68 L60 64 Q76 66 76 80 L76 100 L24 100 Z" fill="#1e40af"/>
  <!-- Hood -->
  <path d="M30 68 Q30 60 40 64 L50 68 L60 64 Q70 60 70 68" fill="#1e3a8a"/>
  <!-- Hoodie strings -->
  <line x1="44" y1="70" x2="42" y2="82" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="70" x2="58" y2="82" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <!-- String tips -->
  <circle cx="42" cy="82" r="2" fill="#60a5fa"/>
  <circle cx="58" cy="82" r="2" fill="#60a5fa"/>
