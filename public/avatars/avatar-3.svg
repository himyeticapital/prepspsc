<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Urban Raj - Snapback cap, chain, streetwear -->
  <defs>
    <linearGradient id="cap3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#10b981"/>

  <!-- Face -->
  <circle cx="50" cy="50" r="20" fill="#d4a574"/>

  <!-- Ears -->
  <ellipse cx="30" cy="50" rx="3" ry="5" fill="#c49a6c"/>
  <ellipse cx="70" cy="50" rx="3" ry="5" fill="#c49a6c"/>
  <!-- Earring stud -->
  <circle cx="30" cy="52" r="2" fill="#fbbf24"/>

  <!-- Hair showing under cap -->
  <path d="M30 46 Q28 52 32 56" fill="#1f2937"/>
  <path d="M70 46 Q72 52 68 56" fill="#1f2937"/>

  <!-- Snapback cap -->
  <ellipse cx="50" cy="34" rx="26" ry="12" fill="url(#cap3)"/>
  <!-- Cap crown -->
  <path d="M24 34 Q26 22 50 20 Q74 22 76 34" fill="url(#cap3)"/>
  <!-- Flat brim - tilted slightly -->
  <path d="M22 36 L30 34 L72 34 L78 36 L76 40 L24 40 Z" fill="#1f2937"/>
  <!-- Brim underside -->
  <path d="M24 40 L76 40 L74 42 L26 42 Z" fill="#7c3aed"/>
  <!-- Cap logo/design -->
  <circle cx="50" cy="28" r="6" fill="#fbbf24"/>
  <text x="50" y="31" text-anchor="middle" fill="#1f2937" font-size="8" font-weight="bold">R</text>

  <!-- Eyebrows -->
  <path d="M38 42 Q42 40 46 42" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M54 42 Q58 40 62 42" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Eyes - confident -->
  <ellipse cx="42" cy="48" rx="3.5" ry="4" fill="#1f2937"/>
  <ellipse cx="58" cy="48" rx="3.5" ry="4" fill="#1f2937"/>
  <circle cx="43" cy="47" r="1.3" fill="white"/>
  <circle cx="59" cy="47" r="1.3" fill="white"/>

  <!-- Nose -->
  <path d="M50 50 L50 54" stroke="#c49a6c" stroke-width="2" stroke-linecap="round"/>

  <!-- Confident smile -->
  <path d="M44 58 Q50 63 56 58" stroke="#8b6f5c" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Light beard shadow -->
  <ellipse cx="50" cy="62" rx="8" ry="4" fill="#1f2937" opacity="0.2"/>

  <!-- Chain necklace -->
  <path d="M36 70 Q50 76 64 70" stroke="#fbbf24" stroke-width="3" fill="none"/>
  <path d="M36 70 Q50 76 64 70" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
  <!-- Chain pendant -->
  <circle cx="50" cy="76" r="5" fill="#fbbf24"/>
  <circle cx="50" cy="76" r="3" fill="#f59e0b"/>

  <!-- Bomber jacket -->
  <path d="M24 85 Q24 70 40 68 L50 72 L60 68 Q76 70 76 85 L76 100 L24 100 Z" fill="#1f2937"/>
  <!-- Jacket collar -->
  <path d="M36 68 L42 74 L50 72 L58 74 L64 68" fill="#374151"/>
  <!-- Orange lining peek -->
  <path d="M42 74 Q50 80 58 74" fill="#f97316"/>
  <!-- Jacket zipper -->
  <line x1="50" y1="72" x2="50" y2="100" stroke="#6b7280" stroke-width="2"/>
</svg>
