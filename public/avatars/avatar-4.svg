<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pretty Priya - Soft flowing hair, cute round glasses, sweet vibes -->
  <defs>
    <linearGradient id="hair4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1006"/>
      <stop offset="100%" style="stop-color:#2d1f12"/>
    </linearGradient>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fecdd3"/>
      <stop offset="100%" style="stop-color:#fda4af"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg4)"/>

  <!-- Long flowing hair back -->
  <ellipse cx="50" cy="60" rx="36" ry="42" fill="url(#hair4)"/>

  <!-- Soft wavy hair strands -->
  <path d="M16 52 Q12 70 18 90 Q14 96 20 100" stroke="#2d1f12" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M22 50 Q18 68 22 88 Q18 95 24 100" stroke="#2d1f12" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M84 52 Q88 70 82 90 Q86 96 80 100" stroke="#2d1f12" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M78 50 Q82 68 78 88 Q82 95 76 100" stroke="#2d1f12" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Face -->
  <ellipse cx="50" cy="46" rx="20" ry="22" fill="#fcd9b8"/>

  <!-- Hair front - soft and pretty -->
  <path d="M30 44 Q32 18 50 16 Q68 18 70 44 Q66 26 50 24 Q34 26 30 44" fill="url(#hair4)"/>
  <!-- Soft side-swept look -->
  <path d="M30 42 Q28 50 32 58" fill="url(#hair4)"/>
  <path d="M70 42 Q72 50 68 58" fill="url(#hair4)"/>
  <!-- Hair shine -->
  <path d="M38 22 Q46 18 54 22" stroke="#4a3520" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Delicate pearl stud earrings -->
  <circle cx="29" cy="52" r="3" fill="#fef3c7"/>
  <circle cx="29" cy="52" r="1.8" fill="#fefce8"/>
  <circle cx="71" cy="52" r="3" fill="#fef3c7"/>
  <circle cx="71" cy="52" r="1.8" fill="#fefce8"/>

  <!-- Cute round glasses - rose gold -->
  <circle cx="40" cy="44" r="9" fill="none" stroke="#f9a8d4" stroke-width="2"/>
  <circle cx="60" cy="44" r="9" fill="none" stroke="#f9a8d4" stroke-width="2"/>
  <!-- Subtle lens shine -->
  <path d="M34 41 Q37 39 40 40" stroke="white" stroke-width="1.2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M54 41 Q57 39 60 40" stroke="white" stroke-width="1.2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- Bridge -->
  <path d="M49 44 Q50 42 51 44" stroke="#f9a8d4" stroke-width="2"/>
  <!-- Arms -->
  <line x1="31" y1="44" x2="27" y2="42" stroke="#f9a8d4" stroke-width="1.5"/>
  <line x1="69" y1="44" x2="73" y2="42" stroke="#f9a8d4" stroke-width="1.5"/>

  <!-- Soft arched eyebrows -->
  <path d="M34 36 Q38 34 42 36" stroke="#4a3728" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M58 36 Q62 34 66 36" stroke="#4a3728" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Pretty sparkling eyes -->
  <ellipse cx="40" cy="44" rx="3.5" ry="4.5" fill="#2d1f12"/>
  <ellipse cx="60" cy="44" rx="3.5" ry="4.5" fill="#2d1f12"/>
  <circle cx="41" cy="43" r="1.8" fill="white"/>
  <circle cx="61" cy="43" r="1.8" fill="white"/>
  <circle cx="39" cy="45" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="59" cy="45" r="0.8" fill="white" opacity="0.6"/>

  <!-- Rosy blush -->
  <ellipse cx="31" cy="50" rx="5" ry="2.5" fill="#fda4af" opacity="0.4"/>
  <ellipse cx="69" cy="50" rx="5" ry="2.5" fill="#fda4af" opacity="0.4"/>

  <!-- Small cute nose -->
  <path d="M50 48 L50 52" stroke="#e8c4a8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sweet gentle smile -->
  <path d="M45 56 Q50 60 55 56" stroke="#d4736a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Soft pink cardigan -->
  <path d="M24 82 Q24 66 40 64 L50 68 L60 64 Q76 66 76 82 L76 100 L24 100 Z" fill="#fbcfe8"/>
  <!-- Cardigan details -->
  <path d="M44 68 L44 100" stroke="#f9a8d4" stroke-width="1.5"/>
  <path d="M56 68 L56 100" stroke="#f9a8d4" stroke-width="1.5"/>
  <!-- White blouse underneath -->
  <path d="M44 68 Q50 76 56 68" fill="#fefefe"/>
  <!-- Tiny bow -->
  <circle cx="50" cy="70" r="2" fill="#f472b6"/>
  <path d="M46 70 Q48 68 50 70 Q52 68 54 70" stroke="#f472b6" stroke-width="2" fill="none"/>
  <!-- Cute buttons -->
  <circle cx="44" cy="78" r="1.5" fill="#f9a8d4"/>
  <circle cx="44" cy="86" r="1.5" fill="#f9a8d4"/>
  <circle cx="56" cy="78" r="1.5" fill="#f9a8d4"/>
  <circle cx="56" cy="86" r="1.5" fill="#f9a8d4"/>

  <!-- Dainty heart necklace -->
  <path d="M44 66 Q50 68 56 66" stroke="#fbbf24" stroke-width="0.7" fill="none"/>
  <path d="M48 68 Q50 66 52 68 Q52 70 50 72 Q48 70 48 68" fill="#fbbf24"/>
</svg>
