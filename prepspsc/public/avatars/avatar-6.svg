<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Stylish female - Cute glasses, wavy bob -->
  <defs>
    <linearGradient id="hair6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#ef4444"/>

  <!-- Hair back - wavy bob -->
  <ellipse cx="50" cy="52" rx="28" ry="30" fill="url(#hair6)"/>

  <!-- Face -->
  <ellipse cx="50" cy="44" rx="20" ry="21" fill="#d4a574"/>

  <!-- Hair front - stylish bangs -->
  <path d="M30 42 Q32 22 50 20 Q68 22 70 42 Q66 32 50 30 Q34 32 30 42" fill="url(#hair6)"/>
  <!-- Bangs detail -->
  <path d="M32 40 Q38 35 42 42" fill="url(#hair6)"/>
  <path d="M68 40 Q62 35 58 42" fill="url(#hair6)"/>
  <!-- Hair waves on sides -->
  <path d="M24 48 Q22 58 26 68" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <path d="M76 48 Q78 58 74 68" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>

  <!-- Stylish round glasses -->
  <circle cx="40" cy="42" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="60" cy="42" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <line x1="48" y1="42" x2="52" y2="42" stroke="#f59e0b" stroke-width="2"/>
  <line x1="32" y1="42" x2="28" y2="40" stroke="#f59e0b" stroke-width="2"/>
  <line x1="68" y1="42" x2="72" y2="40" stroke="#f59e0b" stroke-width="2"/>

  <!-- Eyes behind glasses -->
  <ellipse cx="40" cy="42" rx="3" ry="3.5" fill="#1f2937"/>
  <ellipse cx="60" cy="42" rx="3" ry="3.5" fill="#1f2937"/>
  <circle cx="41" cy="41" r="1.2" fill="white"/>
  <circle cx="61" cy="41" r="1.2" fill="white"/>

  <!-- Eyebrows -->
  <path d="M35 34 Q40 32 45 34" stroke="#2d2317" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M55 34 Q60 32 65 34" stroke="#2d2317" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Cute blush -->
  <ellipse cx="30" cy="48" rx="4" ry="2" fill="#fda4af" opacity="0.5"/>
  <ellipse cx="70" cy="48" rx="4" ry="2" fill="#fda4af" opacity="0.5"/>

  <!-- Small nose -->
  <ellipse cx="50" cy="50" rx="2" ry="1.5" fill="#c49a6c"/>

  <!-- Friendly smile -->
  <path d="M44 55 Q50 60 56 55" stroke="#8b6f5c" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cozy turtleneck -->
  <path d="M24 80 Q24 65 40 62 L50 66 L60 62 Q76 65 76 80 L76 100 L24 100 Z" fill="#dc2626"/>
  <!-- Turtleneck detail -->
  <rect x="38" y="62" width="24" height="8" rx="2" fill="#b91c1c"/>
  <line x1="42" y1="64" x2="42" y2="68" stroke="#991b1b" stroke-width="1"/>
  <line x1="50" y1="64" x2="50" y2="68" stroke="#991b1b" stroke-width="1"/>
  <line x1="58" y1="64" x2="58" y2="68" stroke="#991b1b" stroke-width="1"/>
</svg>
