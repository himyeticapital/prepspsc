<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="timerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#timerBg)"/>

  <!-- Floating particles -->
  <circle cx="150" cy="200" r="2" fill="#f97316" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="250" r="3" fill="#ef4444" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="650" r="2.5" fill="#fb923c" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Main timer card -->
  <rect x="250" y="150" width="700" height="500" rx="24" fill="rgba(24, 24, 27, 0.7)" stroke="rgba(249, 115, 22, 0.3)" stroke-width="2"/>

  <!-- Timer glow effect -->
  <circle cx="600" cy="350" r="150" fill="url(#glow)"/>

  <!-- Timer circle progress -->
  <circle cx="600" cy="350" r="140" fill="none" stroke="rgba(249, 115, 22, 0.2)" stroke-width="8"/>
  <circle cx="600" cy="350" r="140" fill="none" stroke="url(#progressGrad)" stroke-width="8"
          stroke-dasharray="879" stroke-dashoffset="220" stroke-linecap="round"
          transform="rotate(-90 600 350)">
    <animate attributeName="stroke-dashoffset" values="220;440;220" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Timer display -->
  <text x="600" y="360" font-family="monospace" font-size="72" font-weight="bold" fill="#f97316" text-anchor="middle">25:00</text>
  <text x="600" y="395" font-family="Arial, sans-serif" font-size="16" fill="#a1a1aa" text-anchor="middle">Focus Session</text>

  <!-- Control buttons -->
  <circle cx="520" cy="510" r="30" fill="rgba(249, 115, 22, 0.2)" stroke="#f97316" stroke-width="2"/>
  <text x="520" y="520" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">⏸</text>

  <circle cx="600" cy="510" r="35" fill="#f97316" opacity="0.8"/>
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">▶</text>

  <circle cx="680" cy="510" r="30" fill="rgba(249, 115, 22, 0.2)" stroke="#f97316" stroke-width="2"/>
  <text x="680" y="520" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">⟲</text>

  <!-- XP indicator -->
  <rect x="320" y="570" width="560" height="50" rx="12" fill="rgba(249, 115, 22, 0.1)" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1"/>
  <text x="600" y="600" font-family="Arial, sans-serif" font-size="18" fill="#f97316" text-anchor="middle">+50 XP on completion</text>

  <!-- Decorative sparkles -->
  <text x="780" y="280" font-family="Arial, sans-serif" font-size="20" opacity="0.6">✨</text>
  <text x="420" y="280" font-family="Arial, sans-serif" font-size="20" opacity="0.6">✨</text>
</svg>
