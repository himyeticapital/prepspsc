<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80">
  <!-- Cute Shiba Logo with Text -->

  <g transform="translate(5, 5) scale(0.7)">
    <!-- Dark brown outline/background shape -->
    <ellipse cx="50" cy="52" rx="42" ry="40" fill="#4A3728"/>

    <!-- Left ear -->
    <ellipse cx="18" cy="32" rx="14" ry="16" fill="#4A3728"/>
    <ellipse cx="20" cy="34" rx="8" ry="10" fill="#E8A04C"/>

    <!-- Right ear -->
    <ellipse cx="82" cy="32" rx="14" ry="16" fill="#4A3728"/>
    <ellipse cx="80" cy="34" rx="8" ry="10" fill="#E8A04C"/>

    <!-- Main face - orange/tan -->
    <ellipse cx="50" cy="55" rx="36" ry="34" fill="#E8A04C"/>

    <!-- Cream/white chin area -->
    <ellipse cx="50" cy="68" rx="22" ry="18" fill="#F5E6D3"/>

    <!-- Left eye -->
    <circle cx="35" cy="50" r="5" fill="#1a1a1a"/>

    <!-- Right eye -->
    <circle cx="65" cy="50" r="5" fill="#1a1a1a"/>

    <!-- Nose - cream/pink with outline -->
    <ellipse cx="50" cy="62" rx="6" ry="4" fill="#F5E6D3" stroke="#4A3728" stroke-width="1.5"/>
    <ellipse cx="50" cy="61" rx="3" ry="2" fill="#D4A574"/>

    <!-- Cute smile -->
    <path d="M 42 70 Q 50 76 58 70" fill="none" stroke="#4A3728" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Text: PrepSPSC -->
  <text x="85" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700">
    <tspan fill="#2dd4bf">Prep</tspan><tspan fill="#fafafa">SPSC</tspan>
  </text>
</svg>
